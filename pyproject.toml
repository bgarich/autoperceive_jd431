[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bgarich-autoperceive_jd431"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bgarich" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bgarich.github.io"
Repository = "https://github.com/bgarich/autoperceive_jd431"
Issues = "https://github.com/bgarich/autoperceive_jd431/issues"

[project.scripts]
autoperceive_jd431 = "autoperceive_jd431:main"

[tool.setuptools]
py-modules = ["autoperceive_jd431"]
